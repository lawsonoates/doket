name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Check the tag matches the package version
        run: |
          version=$(jq -r .version packages/app/package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/app version $version" >&2
            exit 1
          fi

      - run: bun run check
      - run: bun run typecheck
      - run: bun run test

      - name: Build binaries
        run: bun run build
        working-directory: packages/app

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" packages/app/dist/*.tar.gz --clobber

      # Trusted publishing authenticates through the id-token permission, with no token,
      # and adds provenance. It needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - name: Publish to npm
        run: bun run publish:npm
        working-directory: packages/app
