name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Check the tag matches the package version
        run: |
          version=$(jq -r .version packages/app/package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/app version $version" >&2
            exit 1
          fi

      - run: bun run check
      - run: bun run typecheck
      - run: bun run test

      - name: Build binaries
        run: bun run build
        working-directory: packages/app

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" packages/app/dist/*.tar.gz --clobber

      # Trusted publishing authenticates through the id-token permission, with no token,
      # and adds provenance. This npm release has npm stage. Staged versions go live only once approved with 2FA.
      - run: npm install -g npm@12.2.3

      - name: Stage on npm
        run: bun run publish:npm --stage
        working-directory: packages/app
